name: Update YouTube feed
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch channel RSS
        run: |
          python3 - <<'PY'
          import urllib.request, json, xml.etree.ElementTree as ET
          url="https://www.youtube.com/feeds/videos.xml?channel_id=UCtvAw7ULZmDSy1lzh-Dc6mw"
          try:
              data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=30).read()
          except Exception as e:
              print("Feed unavailable, keeping old file:",e); raise SystemExit(0)
          ns={"a":"http://www.w3.org/2005/Atom","y":"http://www.youtube.com/xml/schemas/2015"}
          out=[]
          for en in ET.fromstring(data).findall("a:entry",ns):
              link=en.find("a:link",ns).get("href")
              out.append({"id":en.find("y:videoId",ns).text,"title":en.find("a:title",ns).text,"published":en.find("a:published",ns).text,"isShort":"/shorts/" in link})
          json.dump({"videos":out},open("portfolio/feed.json","w"),ensure_ascii=False,indent=1)
          PY
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"; git config user.email "bot@users.noreply.github.com"
          git add portfolio/feed.json; git diff --cached --quiet || (git commit -m "Update YouTube feed" && git push)
