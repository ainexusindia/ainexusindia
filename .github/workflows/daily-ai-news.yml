name: Daily AI Pulse update

# Runs every day and refreshes assets/data/news.json with fresh AI headlines,
# then commits the change so the live site picks it up automatically.
# Uses only free GitHub-hosted infrastructure — no API key or paid service required.

on:
  schedule:
    # 03:30 UTC = 09:00 IST, every day
    - cron: '30 3 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch latest AI news
        run: python scripts/fetch_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "ai-nexus-news-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- assets/data/news.json; then
            echo "No news changes today."
          else
            git add assets/data/news.json
            git commit -m "Daily AI Pulse update: $(date -u +'%Y-%m-%d')"
            git push
          fi
